body:
  text: 雲松巢集巻一明朱希晦撰五言寓興四首乾坤一旅亭大夢幾時醒白髪無情極春來不再青山中無别事詩酒作生涯鬢雪空催老何由駐日車山寺鐘聲歇夫寒睡起遲敲氷添硯水發興寫新詩風塵猶澒洞江海轉深沉不作乗桴興徒懐擊楫心六言江村冬日清景屋外梅花的皪籬邊澗水潺湲竟夕詩翁睡著不知雪滿前山寒江獨釣翠壁寒雲淡薄滄江老樹蕭疎輸與扁舟漁父一生意釣忘魚雲山僧樹暝煙生絶壁瀑流雨洒虚潭他日來尋懶瓉枯禪還許同參秋日客懐百嵗光隂石火幾畨世事雲萍試問誰人有藥能醫白髪重青梧葉聲中夜雨桂花香裏秋風巢幙偏驚客燕寄書不見征鴻桑落誰家有酒荷蓑客子無衣斜日江樓北望凉天鴻雁南歸七言西湖絲絲細雨弄春晴新水溪頭杜若生我欲與君攜酒去緑隂樹底聽啼鶯客簫臺書懐有客尋幽蹈紫霞杖藜入竹訪仙家相逢不道春光老門外溪風落棟花雲山僧舎千山萬水一枝筇身在烟霞第幾重最好雁邊秋色净倚天空翠出芙蓉秋日和韻溪上危峯亂挿空雨晴蒼翠尚濛濛不堪昨夜西風急吹落半庭霜葉紅次御史端公遊簫臺韻烟鎖千峰紫翠層隔溪幽鳥語相應碧桃花謝玉芝老不見神仙只見僧寄友不道愁中生白髪也知客裏對黄花凄凉正是陶元亮有酒無錢何處賖戯簡叔向陳先生朋南阮君名動竹林惟阮籍氣吞湖海有元龍相逢一醉思茗飲細故不留雲夢胸秋懐怪底浮雲翳碧空千山秋水入溟濛何當一掃羣隂盡坐看東方片日紅酬李適菴謾笑人生有底忙讀書堅坐白雲房孫陽未遇騏麟老空厄鹽車太上行酬間上人潮退滄江露石磯生縁千古一天衣葛藤牙蘖依前長影落長空寒鴈歸和槐堂李先生韻人生離别將奈何滄江渺渺山峩峩山花亂紅江水碧水流花謝春愁多又江山有待故人來好向春風酌緑醅啼鳥聲中春爛漫雨香昨夜碧桃開喜雨稻田渇水十日晴水車踏轉如雷鳴老夫中夜喜不極睡覺枕前聞雨聲和趙翰林韻脱却春衫換酒來深杯勸客壯懐開生前萬事不如醉落日烏啼金粟堆寄友雨過溪頭鳥篆沙溪山深處野人家門前桃李都飛盡又見春光到楝花和謝玉堂歸老趙修撰佳客乗閒訪隱居旋沽村酒鱠溪魚燈前忽憶十年事留宿壺山夜讀書用趙修撰先生韻結屋山中逺市囂雨餘荒徑長蓬蒿平生身外無他事勸客尊前有濁醪夏日山居九衢赫赫漲塵埃車馬憧憧自徃來争似山人忘世念枕書髙臥竹扉開寄天則上人老年衰病藥相扶豈有神仙碧玉壺睡起不知春雨過半畦佳菊没榛蕪次回峯西堂韻孤雲無住亦無依長向空中自在飛情素本來無一物何須惜别更留衣次李二丈韻看花醉眼不須扶花下長歌擊唾壺回首荒城春較晚淡烟疎雨緑平蕪春日有懐無邉花栁競芳春醉眼看來幾度新今日曲江風景别落紅飛絮正愁人次回峯韻煖日浮烟翠欲消四山空寂境蕭條飽參禪老庭前栢不問劉郎觀裏桃五言律净名寺鴈山十八刹之最勝者纔入清凉境憑髙意豁然山横烟簇簇溜滴雨涓涓静坐維摩室微參達磨禪秦名人已逺遺像閲千年秦名故事見鴈山誌寄無際老禪萬事不掛服把茅還葢頭林深従鹿卧海闊任鷗浮圓澤三生契曹溪一宿留我牽塵業在衰白縂成休失鴈畜爾經年乆懸知羽翮長别來應念侣秋至忽南翔遽欲摩雲漢能無戀稻粱更防機事密羅網不虚張感時隂霾昏日月妖氣塞乾坤戰血流淮水音塵隔薊門浮榮槐蟻集叢謗棘蠅喧欲效東陵隠終身老種園又觸目傷時事干戈鬱未開百年馳白日萬里漲黄埃廢苑猶花栁荒城但草萊登樓作賦罷不獨仲宣哀秋日咏懐老作衡門士長思栗里翁髩添今日白顔減向時紅滿地蒺藜雨一天鴻鴈風傷心看江水日夜只流東又天地一今古江山幾别離浮雲蒼狗變急景白駒馳老去猶詩律憂來更酒巵自従絃絶後無復覔鐘期感秋時光隨過鳥身世寄蜉蝣漠漠江雲晚蕭蕭塞雨秋杜陵長戀闕王粲獨登樓故國今戎馬南征尚未休時事貧病知交態驅馳愧老身薊門深雨雪淮海暗風塵雖有樓船將能無柱石臣㑹須安反側早晚畵麒麟軒居何處净芳襟晴軒俯碧岑鈎簾賖月色隠几快人心世道有榮辱雲山無古今吾生何太晚側耳聴虞琴傷時嘆息王綱廢由來戰伐頻周墟半禾黍秦籍總灰塵鳯去雲霄暮雞鳴風雨晨至今流渭水空憶釣魚人春日自况江邉雨初過正是踏青時載酒興不淺杖藜行較遲日隂團碧樹風煖韻黄鸝與客恣遊賞醉來還賦詩期倪従事不至用韻以寄天地雙蓬髩江湖一酒杯不因佳客至争得好懐開拄頰看山坐登樓待月來黎明還送别歌罷重徘徊次韻答李適菴泛渚輕鷗並啼霜旅鴈孤池幽心自佚路險意何須蘭茝香堪佩茅茨細可誅榮名安足羡耕釣乃吾徒答李廣文不有封侯相安能食肉飛溪山猶發興魚鳥自忘機曳杖看雲去褰衣步月歸驪珠忽在手怪底吐光輝次韻答友天地等逆旅利名俱惱人蓬萊三萬里莊木八千春白積巾中雪紅飛陌上塵人生行樂耳杖履素相親次韻答叔向陳君之子當時傑人中見不多豫章蟠厚地砥柱障狂波富貴須行樂棲遲足嘯歌相逢尊有酒莫惜飲如何次韻懐友江山供逺眺萬景倍凄清烟樹連秋色霜鐘報曉晴憂時雙髩改戀闕寸心明誰識杜陵老長吟涕泗傾漫興偶成擾擾貪名者驅馳易白頭江山長不改嵗月急如流且盡一尊酒共消千古愁可憐金谷廢人去月當樓寫懐試拂青萍劍頻啣白玉杯容顔不再好笑口幾時開水滿魚兒出泥香燕子來江山千古意臨眺重徘徊約友川岳自今古隂陽相主賓紅塵紛野馬白日少間人忽忽身將老欣欣物自春相知有朋舊簮盍莫辭頻簡雪心安上人意行無逺近得得扣柴扉鼎出金芽細盤堆紫蕨肥看雲忘世慮指日悟禪機錯比陶元亮重來盡醉歸簡叔恭蔡先生舉世紛讒舌鋒芒不可干驅車嗤阮籍學易慕丁寛試問黄河險何如蜀道難太平無補報只有寸心丹春日訪友人行尋春草徑坐敞白雲扉展席面流水抱琴看翠微紛紛浮世改落落故人稀尚意陶徴士柴車日暮歸寫懐急景催人老能令髩有霜清時思俊傑拔萃愧材良鵬鷃自髙下鶴鳬終短長山牕讀書罷静坐一爐香春日春來鋤藥圃客去掩柴扃衰髩不重緑好山依舊青微名空自絆大夢幾時醒已悟身如寄乾坤一旅亭次韻謝簫臺葉成翁市上一區足人間萬事非把杯邀月上隠几看雲歸宇宙身將老山林興不違幾時來鴈蕩長嘯豁巖扉上楊指揮將軍聖主登宸極奎躔爛逺天新開丹鳯詔瑞紀赤烏年山野搜遺逸朝廷集俊賢老農還喜劇買犢事春田次鄭成翁韻鄭老欣相遇杯浮竹葉清江闗秋已半山雨夜初晴河映疎星淡牕懸片月明悠然縦談笑懐抱為君傾和李子光韻門外客初到坐聞流水聲看書芸葉亂醉酒燭花明夜静河漢白秋髙霜露清𤣥心開一笑詩思忽然生能仁方丈山中松桂老濃翠鬱紛紛水壯蛟龍氣風髙鴻鴈羣浮嵐晴後見疎罄夜深聞却憶龎居士衰年屏俗氛雲松巢集巻一
