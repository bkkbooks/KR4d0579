body:
  text: 雲松巢集卷二明朱希晦撰七言律詩五十四首大龍湫即能仁寺大瀑布入眼千峯翠作堆喜尋龍鴈窟中來半崕有日飛晴雪一壑無雲吼怒雷駐錫已知尊者意揮毫空想謫仙才忘歸亭下忘歸客手弄潺湲坐碧苔忘歸亭在瀑布下送王田著作歸赤城江海飄飄萬里身醉遊隨處樂天真地無王氣非佳地人有方瞳是異人可恨龍盤遺建業誰憐魚腹葬靈均明朝杯酒還相别愁送驪駒又送春夏日書懷滄江無處不風波欲理扁舟可奈何白髮生涯人已老緑隂時節雨偏多杯傾鸚鵡同誰醉劍拂蛟龍强自歌蓋世功名非我事終期結屋卧雲蘿和習之鄭先生韻愧我才疏齒俊髦也知文物勝弓刀松邉展卷白日靜桞下繫舟春水髙自昔襟期同鄭老當今藻鑑失山濤憑誰說與觀風使要活疲民去吏叨感懷自嘆頺然一老翁十年奔走鬢飛蓬中原虎鬭干戈滿四海人憂杼軸空葛亮平生恢復計汾陽材略中興功何當逺望舂陵郭佳氣朝來正鬱葱排悶簡王同善囦上人流光過眼已侵尋富貴何須滿塢金人世自生今日事朋交不改向時心管寧老去常烏帽元亮歸來只素琴記取嵗寒同雅操長松青映柏森森秋興月明何處亂啼烏坐久徒憐永夜徂千里關山雙雪鬢百年城郭半烟蕪穆生謝病先辭楚張翰知機逺憶吳衰晚不如歸隱好故山隨處且樵蘇寄周廷石門外曽無長者車一身奔走豈安居誰憐杜老長為客我怪洪喬不寄書烟色春歸楊栁底雨香紅入杏花初溪山咫尺風塵隔却憶人情㑹面疏有所思虛聞將帥擁彤戈勇鋭誰如馬伏波幾處烽烟連夜急四郊風雨向秋多最憐絶漢歌長鵠却怪長安饜紫駝俯仰乾坤增感慨悠悠身世定如何有感城東向晚進風凉思酒無由入醉鄉人壽不同天地老客愁應共水雲長滄江風轉蘆花起舊圃秋深草蔓長安得歸來遂幽意呼童净掃讀書牀傷時流年華髮兩相催眼底烟塵鬱不開太息有人趨玉食可憐無地築金臺城邉向晚黃狐立海外何年白雉來萬事何如一醉好且須洗盞酌春醅時危初聞羣盜起河北胡乃流毒江東西落日空城見烟樹秋風滿地喧霜鼙人忍貪殘作蛇豕疇能憤切誅鯨鯢中興自古須將相濟時有䇿安黔黎悼時北風獵獵吹沙塵天隂雨雪愁殺人江湖萬頃舞蛟蜃山藪千年藏鳯麟蘇卿使節未歸漢商皓採芝先避秦重華世逺不復見嗟哉風俗何由淳自嘆匠石搜林棄樗散不材何敢玷簮裾家貧粗有千金帚國難曽無一箭書今日總戎師管葛明時徴士用嚴徐野人不作功名念欲效陶朱共養魚憂時總憐黃鵠久離羣隻影孤飛日暮雲淮海十年流戰血楚天萬里接妖氛凄凉王粲登樓賦感慨相如諭蜀文自古英雄亦何限幾人戡亂樹功勛和友人韻誰能餐玉駐顔光兩鬢都消鏡裏霜豈有雄文驅海鱷恨無長矢射天狼十年南國風塵滿千古東陵草蔓荒興發㑹應尋范蠡扁舟散髮弄滄浪别雲山老禪風流老禪思不羈悠然邂逅川水湄謾笑支郎愛神駿素聞𤣥度能工詩天關九重守虎豹江海萬傾生蛟螭棗大如瓜信可食何時徑往尋安期别囦上人鼎食何如飽蕨薇由來富貴履危機鶴鳬依舊自長短鹿馬至今誰是非每好問奇兼醉酒那堪惜别更留衣人生聚散知何處風送秋雲一片飛簡李二丈滿地兵塵暗夕烽可憐憔悴更衰容故人消息沉雙鯉白日光輝轉六龍適意久拚拈濁酒發音誰解奏黃鐘管寧已向遼東去欲買扁舟恨莫從與夏彥伯白首相聞非一日青春傾蓋動兼旬艱難總為泛舟役羈旅乃得連牀親鳯凰叫月簫臺夜蛟蜃翻雲玉溜春此别何時重㑹面不堪回首隔風塵答沙都事尚憶當年羽葆乘河流如帶繞山岡男兒墮地四方志竹帛埀名千古香越石枕戈終破敵蘇卿持節未歸鄉慨豫疏懶成何事祇合藏身老墨莊次韻簡緱山侯德詢徽之二徵士幽尋杖䇿繞林泉隨處遨遊興灑然曽向山中招隱士欲來海上候神仙雲深丹竈長瑶草水滿石池生碧蓮薄暮憑䦨時送目白鷗飛雪㸃江烟次韻簡仲謙倪公叔向陳先生老夫頭白猶眼青喜瞻北斗聮文星陳生飯客甑忘簟倪子業儒鋤帶經矯矯龍蛇出大澤翩翩鸞鳯摩青冥方今徴賢急如渴㑹見戔帛輝林坰豫傷時不古知老將至嘆息成詩呈諸同志涇水何曽混渭流心忘寵辱自無憂底須老執揚雄㦸且復閒尋范蠡舟不見越裳來白雉徒聞蜀嶺過金牛由來感慨關人事回首春風憶舊遊送天衢首座還故山鳯凰山今在海中去永嘉界可三百里元時航商所集國初禁絶以杜倭冦鳯凰山上瞻華蓋師住白雲知幾重海日樓臺金翡翠天風亭榭玉芙容已經大頂騎馴虎更向靈源覔卧龍昨日逺公曽有約禪餘看雪最髙峯寄習之鄭先生人生異路分雲泥山尊酒緑思同攜雪色上頭老冉冉風聲落葉凉凄凄南陽深處尚龍卧北蕩空山惟鴈啼何日相期遊汗漫手弄白日凌丹梯贈倪仲謙江海鷗盟幸未寒曽將尺素問平安每懷徐孺空懸榻却憶逢萌早掛冠半夜明星連寶劍九秋清露溢銅盤誰能授我長生訣白日丹成生羽翰次竹隱二弟韻僑居村僻面江郊又見蘭階玉樹髙兩袖秋風停野騎半篙秋水漾漁舠别來每憶歌棠棣老去猶聞愛絳桃惆悵對牀空有約幾回風雨夜蕭騷懷古寄友崑崙峯頂何巍哉五城樓闕天中開坐招洪崖駐羽蓋笑把西母傾霞杯古今人世一大夢英雄霸業仍堪哀銅仙淚潸承露掌野鳥歌上琅琊臺答璣上人巖扉晝靜白雲生一枕松濤入夢清華髮故應知老態淡交還復見真情參𤣥已悟三乘法汗簡何須萬古名我住蕩南君蕩北平生懷抱幾時傾簡彥明趙徴君羲和鞭日竹蒼冥百年世事如雲萍自憐老去鬢俱改誰道春來愁不醒野岸風微栁花白江津水暖蒲芽青鱠雪紅肥社醅熟幾時一到河山亭次適菴李先生韻悠悠身世更何如布褐由來勝錦裾今日岐陽無鳯鳥秋風笠澤有鱸魚功名底用傳身後道業還應繼緒餘更好買田深築室相期黃髮老巖居春晚感懷寄李廣文𤣥髮經年半已斑避喧何計入深山我無大藥能醫老誰有真金肯買閒三月花開反惹恨幾時酒醒一開顔别來若有新詩句好倩郵筒日往還酬申屠翰林人中至寶識璠璵詞氣飄飄遇子虛五夜南宫曽賜被十年東觀飽看書賓筵秩秩尊三老祖帳紛紛饑二疏吳越溪山信清美杖藜隨處勝安車和韻簡天則上人凉風嫋嫋晚秋天潮落雙門纜客船永嘉郡城北有二門郭璞所以立名雙門九陌黃塵蓬鬢底一籬香露菊花邊故鄉鱸鱠牽歸思近砌蛩聲攪夜眠不道分攜成逺别幾時林下細談禪九日秋晚林臯木葉飛凉風嫋嫋鴈南歸自慚席上著烏帽不見門前來白衣甕滿香雲醅酒熟盤飛紅雪鱠鱸肥興來隨處堪行樂何必佩茰登翠微呈丹霞老禪一蓑風雨一漁竿家近梅花涉水灘投報已無青玉案駐顔寧有紫金丹龎公老去獨耕峴李願從來久隱盤自古山林有遺逸敢將名字動天官次韻謝東白葉先生三徑歸來細竹斑山人本性愛丘山紫扉半掩紅塵滿詩句長哦白日閒豪氣固應嗤梓澤幽棲不獨羡商顔舊傳却老方應驗我欲相從問大還訪雙溪上人不遇雙澗縈回石徑微烟嵐分翠濕人衣松林夜靜鶴初睡花院日長僧未歸萬里雲霄飛錫逺半江風浪渡杯遲無緣相見空相憶自嘆心期與願違述懷寄劉休休居士雲繞青山水繞溪隱居滋味只羮藜春風底事生華髮暮景何須待紫泥寫罷素書無鴈過喚回清夢有猿啼長安市上多年少賜錦紛紛競鬬雞營壽壙在世徒懷身外憂漢家陵墓已荒丘烏鳶奪食終難忍龍虎圖形莫浪求千載空遺兩翁仲百年同是一浮漚何如早約柴桑老結社得隨惠逺遊依韻奉謝原禮先生枕溪住處溪水深竹樹雲屯青滿林摩詰詩為有聲畫淵明趣在無絃琴鵷鸞冲霄五彩翮騏驎伏櫪千里心雄篇贈我細把玩光價豈止雙南金次潘北山鄭叔允韻閒來興趣倍清新自愛青山作主賓天上幾時停白日世間何處避紅塵鶯花滿目娛佳景雞黍同盟憶故人笑我年衰才較拙敢將一曲和陽春臘日偕葉東白蔡伯恭登西岑絶頂雲生一徑通寒生短髮却天風千年物色䦨干外萬井人家圖畫中宿雨亂滋嵐樹碧朝暾深浴海波紅我來欲訪香山社醉酒長吟憶逺公寄天寧方丈霜樹蕭蕭萬葉丹誰憐倦客尚江干性情每向詩中寫勳業何須鏡裏看萬里江山秋月老一天星斗夜光寒近來滿目多荆棘始信人間行路艱簡士舉陳教諭憶昨天南獨倚樓德星炯炯夜悠悠賈生名重醇儒列韓愈才髙博士流老去囊中無長物由來皮裏有春秋他年禁直皇居近天祿書多待校讎呈浦雲趙修撰憶昔承恩入禁闈儒林便覺有光輝九重旭日開金殿五色春雲照錦衣庠序人思三老去都門祖餞二疏歸歸耕幸喜身康健雨足東臯隴麥肥劉休休病起買得南山為卜居青松緑竹䕃吾廬日長門外堪羅雀水滿溪頭好釣魚脫粟飽時過禁臠杖藜行處當安車家僮忽報長鬚至喜接平安一紙書寓興白髮園丁喜種園謾將方法教兒孫土膏有力須培本鎌鐵無情莫刈根葵藿不堪資鼎食韭菘粗足媚盤餐吞腥啄腐今何限誰識芳鮮味獨完寄適菴李先生九衢轍跡黃塵滿一隙駒隂白日過俗事絆人清興少山尊留客好懷多懸知李白偏能賦却羡秦青最善歌自古榮名身外事耕雲只合老巖阿書懷呈同志今古浮榮不足論一生旅寓任乾坤輪囷謾長千年木濩落還成五石樽誰復掛冠辭漢闕客多鼓瑟向齊門野人自信無機事年老何妨且灌園用韻簡叔向陳先生門前車馬紛如蟻草徑幽深肯暫過老去馮唐饒髮白歸來季子得金多春江水闊魚初上曉樹烟開鳥欲歌賴有故人相慰籍杖藜數數到巖阿寄李適菴陳叔向二先生中年作惡不勝情無復芳尊酒共傾老我韶華如逝水多君詩律似長城江東千里暮雲合池上幾回春草生想見憑䦨亦清絶隂隂緑樹有啼鶯幽居漫興地絶塵喧境自寬溪南山色坐中看竹吹緑霧沾書帙花發紅雲映藥欄常養泰和知氣壯不求徴祿得心安自從一笑忘魚後年老何曽把釣竿雲松巢集卷二
