  - {type: page-break, offset: 0, content: '', id: KR4d0579_WYG_000-1a, image: WYG1220/WYG1220-0621a.png}
body:
  text: 雲松巢集别集類四元提要臣等謹案雲松巢集三卷元朱希晦撰希晦樂清人至正末隱居瑶川與四明吳主一簫臺趙彥銘遊詠雁山之中稱雁山三老明初有薦于朝者朝命未至而卒是集乃其子豳所編天臺鮑原宏為之序正統中其元孫元諌刋板章陬又為之序原宏序稱其飄逸放曠宗于李典雅雄壯宗于杜陬序稱其思致精深詞意豐贍滔滔汩汩如驚濤怒瀾蛟鼉出沒而可駭可愕今觀其詩五言詩氣格頗清而邊幅少狹興象未深數首以外詞旨略同七言稍為振拔古體又勝于近體溯其宗派蓋瓣香于劍南一集原序所稱未為篤論也乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀雲松巢集原序初豫在樂清咨訪故老得瑶川朱先生希晦而惜其死矣先生當元季有詩名在士夫間而行檢尤峻潔可重時秉使節下甌越者如僉憲宋公學士貢公皆願見儀範以厲士風入國朝先生鬚髮皓白動合軌度幅巾短策徐行林壑望者以為神仙中人郡邑始行鄉飲酒禮求齒德崇髙名實相副足充大賓者而先生居首選豫嘗厠翰林修撰趙君彥銘客席得見梅灣詩八首而楮尾先生自署姓名惟豫謹圭誦再四不能去手因揚榷於衆曰古人謂名下無虛士信然也而每欲見其諸子求先生全集以觀未能也間嘗道經瑶奧瞻先生舊第在叢林間而菟裘有曰永春菴者輒式焉永樂五年秋豫自京師還龍鳴山中而先生之子豳袖出雲松巢詩集謁豫言曰豳先子平生之志發於詠歌者盡在是編願序以埀諸逺豫謂詩自三百篇以後惟唐為盛唐人以詩名者千餘家而李杜最著以故後世言詩者率以李杜為大家數而宗之今觀是集其飄逸放曠者宗於李歟其典雅雄壯者宗於杜歟先生可謂善於學詩者矣惜豫不得親見先生以談詩家利病而又慶其有子能守先生之家學也序而載名其上永樂五年十月晦日迪功郎伊府紀善天台鮑原𢎞撰雲松巢集者樂清朱先生希晦所賦咏也先生家瑶川世有令德自幼嗜學勵行有志於古人元季遭海內亂遂囊括不仕益閉户讀書以究其業下筆才思泉湧而於詩尤工故因物寄情傷時感事凡有觸於外而動於中一於歌焉發之日增月積多至千餘篇扁其室曰雲松巢而稿因以名焉自先生沒迄今五六十載而瑰詞藻句往往傳誦于世豫每見而竊嘆之且以未獲覩其全集為恨正統庚申其玄孫美從豫讀書空明山中間嘗捧先生遺稿示豫請為之序豫發而視之但見其思致精深詞意豐贍滔滔汩汩如驚濤怒瀾蛟鼉出沒而可駭可愕要其所至多有得于唐人大方家之心法而無雕琢委靡之氣故沈潛反覆纍日不厭焉嘗因是推之先生以有為之才不幸生于季世故形於言者淡然無求于時而怡然有安貧樂道之志往往自放於山巔水涯以寄其興而摸寫雲林泉石之幽以及草木昆蟲之變雖所寓不同而皆曲盡其妙至于閔時病俗婉詞諷刺又有得于風騷之遺意焉故玩其詞想其人而知先生之不遇為可嘆也使其生于明時而出其所有以鳴國家之盛豈不偉哉雖然先生之志固不獲自見于世而其可以傳世埀後者未必不在乎是矧其諸孫咸有志以繼述而美方以俊又選為郡庠生異時業成名就以昭先生之德者尚有待也若然則是集之傳將彌久而彌彰矣奚待序而顯哉然美之請甚勤有不容于終默者因書以歸之正統六年嵗在辛酉四月初吉賜進士出身行在禮部主事台郡章陬撰雲松巢集原序
