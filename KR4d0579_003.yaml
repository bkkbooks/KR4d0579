body:
  text: 雲松巢集卷三明朱希晦撰古選四十五首憎鵑吾聞反哺烏至孝有純德鳥中比曽參傳誦人皆識又聞馴化雉翔集在咫尺陌上隨行車飲啄自朝夕嗟爾蜀幸帝愚暗亡其國遊魂化為鵑物理固莫測一身尚羈旅羽毛亦虛飾生雛百鳥巢螻蟻竟飽食春風口流血有恨啼不息侯門拂笙竽豪客紛彈射豈不思南歸奮飛摧短翼何如雉與烏飛鳴隨所適和囦上人愛松吟衆木與時謝孤松自寒色深根逺莫移老幹益堪惜溪南有餘地塵外頗幽寂手種一萬枝心期二千尺風雲歘交㑹雨露浸生息他日此盤桓清隂覆泉石比述軒轅初鑄鼎鼎成乃登仙龍髯不可攀白日飛上天嗟豫墮世網安得窮山川鼎湖渺何許悵望秋風前又寶鏡何團團光輝瑩氷雪疑是造化爐神工初鑄出又疑廣寒宫飛墮一片月照人不照心紅顔易衰歇又彤弓如半月力挽二石强戡亂乃見用櫜鞬寧又藏應弦不虛發狐兔焉敢當疇能挾長矢為我殪天狼又東南有美箭出自稽山竹初發號哀猿再發落飛鵠憶射聊城書功成一何速賢哉魯連子千古仰髙躅自述老鶴復老鶴籠中稀飲啄豈無萬里心髙飛向寥廓又君看堂上燕差池自雙飛一朝秋風起巢空何處歸又驅車出城東禾黍生故宫君看兩銅駝卧此荆棘中又驅車經北邙悲歌淚如水君看冢纍纍埋沒蓬蒿裏所思鸚鵡本聰慧不與凡鳥同因以巧言語何由脫樊籠又百舌復百舌間關弄春晴讒臣在君側巧語誰為聽又門前好楊栁春風搖緑絲花飛亂白雪青春能幾時雜詠戶樞動不朽源水流不濁修身保天和味道得真樂又北叟塞上馬秦人宫中鹿語默知是非得失見禍福又嗟彼橫江鯨一朝著釣餌何如五總龜曳尾泥塗裏上陳員外荆山鬱嵳峩屹立髙摩空光輝韞奇璞瑞氣成白虹草木借餘潤飛雨青濛濛懸知有至寶追琢煩良工連城未易酬美價璠璵同行將獻天子持入光明宫和謝一源上人道人來蜃江移席秋夜深天髙明月出清輝浴波心道人來鴈蕩懸錫青松岑瀑布落晴雪烟霏生夕隂謝公去已逺遺跡誰能尋詎那宴坐處千古開禪林蓮宫聳突兀布地皆黃金何時一洗耳試聽穎師琴平生屐幾兩亦有山水淫懸知羣鳥中有此孤鳯音行當謝世事與子同浮沉和簡叔向陳先生仲謙倪公我家雁蕩南嘯傲雲松下平生伯牙絃不恨知音寡晚交倪與陳荏苒幾寒夏騏驎日千里鼓車豈合駕緬思昌黎公低頭拜東野文潤三峽流毫端恣揮灑奮飛既胡越有懷不可寫新詩來啓豫滄江珠盈把于時月露清竹葉灧金斚遺音鏘鈞韶古意薄風雅遙瞻德星聚炯炯光照夜漢廷方渴賢平步登金馬譬如磊砢材匠石豈云捨寧為汲黯戅無效齊王假披肝見精誠結舌類喑啞古來英雄人起自耕隱者次本之侯先生侯居緱山宋節毅公侯畐之孫憶昔抱長劍去作東南遊緱山髙刺天翠繞藏書樓修竹净三徑往來惟羊裘蒼龍未變化紫鳯曽棲不上攬明月輝下盼滄江流酒酣發長嘯萬籟生清秋别來難再晤奈此人事稠每懷招隱處桂老山更幽隱士不可招援桂聊淹留賦詩且自樂斗祿烏足謀納凉無事解衣坐超然心境空深林翳炎日萬壑來天風閒停白羽扇試拂朱絲桐醉罷不知夕月生滄海東自述槿花不終朝幽蘭有餘香朝遊詩書圃夕憩翰墨場飽食待秋實過眼捐春芳疇能事形役奔走白日忙男兒生墮地壯志在四方胡為守一室鬱鬱徒悲傷何由寫胸臆酣酒竭罍觴髙飛羡黃鵠矯翮凌雲蒼除夕麒麟在靈圃瑞世為禎祥五蹄而一角形類非犬羊西狩不得時折足邅鉏商宣尼空悲嘆涕淚沾襟裳嘆世乾坤一開闢日月常往來朱顔不再好白髮專相催曠視藐萬古榮名安在哉遁世有餘樂何必求蓬萊答東白葉徴士至寶惟人材所寶非全璧緬懷古聖賢俯仰流汗赤龍媒日千里逺道如所適一鳴萬馬瘖見之皆辟易伯樂雖相知不辨驪黃色斯人去我久千載猶旦夕偉哉東白翁平生數親炙南望吹簫臺矯首空嘆息何時一相見斗酒澆胸臆醉酒且勿言中心期飽德寫懷人生有定分胡為亂天常尺土乃培塿散樗非棟梁觀魚慕莊子御馬思王良丈夫貴知已鬱鬱徒自傷又野老何愚庸團形從大塊林居玩清景悠然與心㑹佳菊沒榛叢幽蘭伍蕭艾嵗晚氷霰交見之徒感慨又巢居不厭客况乃佳客至擷蔬薦濁醪談經得真趣歸雲度遙岑斜日在髙樹對飲須盡歡何時復相遇人生能幾何行樂貴適意不見萍與蓬飄飄無定處搔首仍踟蹰臨風發長喟雜詠威鳯備五彩羽毛一何奇歘乘長風起誤落天南陲朝食琅玕實暮棲瓊樹枝行當凌八極斥鷃焉敢窺自况擬古風波在平地世路幾瞿塘懷哉賢哲人千載能留芳懸知蕭艾多不比猗蘭香老翁聊自笑髮短心甚長又羲和鞭六龍白日不我待讀書竟無成坐惜朱顔改長安誇鬬雞豪華豈長在何由得成仙髙飛向蓬海又人生天地間倏若塵棲草恨無大藥資容顔豈長好白璧終銷毁青松亦枯槁飲酒且放懷毋為歎衰老又隱士居丘園衡門守荒寂啜菽甘有餘飲水清無極嗤彼夸毗兒浮榮定何益梓澤今已空春風蔓茨棘自述吾聞漢中郎琴斫焦桐尾縆以朱絲繩遺音中宫徴上絃操白雪下絃彈緑水世無賞音人誰能一傾耳又狂世等浮雲變態何紛紛龍媒行萬里恥與駑駘羣自從周道廢雅頌不復陳願言繼先哲千載埀清芬又羣書日夜讀往往皆陳編何如窮物理朗悟心中天坐來萬想滅靈府何翛然所思在良友使我長悁悁山居自况嗟豫任疏懶落落負明時𤣥髮倏已改素心終不移焚香讀周易觴酒調朱絲所樂在冲淡浮名良可嗤齒疾我今老將至輔車邀病魔一語不出口終朝卧林阿退之念脫落幼輿能嘯歌蔬食滋味少咽漱津液多眼明幸讀書流年任蹉跎答汪謙之先生江城滿樓臺月夜吹笙簫神仙集華蓋鸞鵠來丹霄中有羽衣客舉手欣相招扶桑朝出日溟海秋翻濤一身藐八極御氣時遊遨悠然視天宇萬古同泬寥却思卧𤣥圃天雞弄嘐嘐飢餐金光草渴飲玉巵醪何當乘清風躡鯉隨琴髙自述寄友十月天雨霜木葉半凋悴巨海增波瀾羣峯獻蒼翠身居一窩中意出萬象外喜聞古人言頗勝俗客對設席羅酒漿未飲已心醉曜靈急西馳盛年豈能再送子才出門天風舞蘭佩義鶻行林深結暝色蒼翠搖烟霏維時春夏交衆鳥巢髙枝於中有雙鸛卵育常及時舂鉏亦有托旦夕欣相依雄飛逺求食雌來哺其兒啁啾聒人耳坐厭腥風吹羣雛半黃口翅短爭習飛間或邅彈射滋味焉足奇弱者强之食感慨徒傷悲海鷹何從來鷙猛一何酷騫騰復盤旋意欲餵飢腹老拳不空施利嘴貪食肉鸛兮善護巢飛鳴急驅逐鷹兮雖善揚叨饞豈知足鳥雛賴生全脫禍免茶毒扶弱在抑强足以厲風俗豈不見兄弟怒䦧牆夫妻讎反目恤憐當救災敦姻須睦族禽鳥尚急義人情何反覆吾言非針規履行宜自朂卧雲卷為陳去題吾聞神仙人中有希夷子冥棲華山顛髙卧白雲裏和友人韻孤桐生髙岡幽蘭出深谷雨露含碧滋烟霞媚幽獨佩惟楚客紉琴待良工斫嗟彼春風前紛紛艷花木和彥逺葉先生韻姬周得天下亂臣才十輩王綱一解紐政教何茫昧宣尼抱麟泣此意誰能㑹從來六籍灰文風委蒿艾窮兵尚專征豈識包桑計故國悲黍離日落寒雲翳吾聞昔盛時蓂莢生堯砌冬雨嘆癸卯冬十月海陬氣侯偏風南忽風北寒燠非常年緼袍御還脫長箑揮不捐胡為黃落時花卉紛爭妍蟲鳴應蟄戶虹見飲長川兼旬苦霧密暝與癡雲連深泥汚后土行潦凌髙原農夫輟耒耜勞嘆心悁悁二麥不得種飢坑詎能填格鬬况未息中原擁戈鋋天家重租稅瘡痏誰能憐安得倚天劍一掃開青天金烏任騰翥出自扶桑顛陽光照六合比屋俱歡然古風月夜放歌海雲卷盡明月來天光鏡碧無纎埃嘯歌于此興不淺美人對坐飛瓊杯碧桃花香夜初靜露滴衣裳怯清冷安得兩翼飛上天為渠拂拭山河影乾坤一照越光明就中殺却妖蟇精上訴天公契人意免教朔望生虧盈𤣥霜搗成誰可食好向仙娥問消息服之到老無飢渴贏得讀書眼常碧有感君不見千里馬有時困羈靮不遇九方歅龍文更誰識又不見五彩鳯有時鎩羽翮不如鶩與雞聚族自爭食人生邅轗軻俯仰今猶昔賢有不黔突聖有不暖席聖賢尚栖栖我獨何惻惻但恐白日沉年光竟虛擲乾坤等蘧廬壽命非金石願餐不死藥蓬瀛杳難覔乘化復奚疑委心任所適故國遺銅駝秋風暗荆棘霸圖有興衰人事無休息矯首望歸雲鴻飛楚天碧贈國恕先生客中識面始見如故先生卜築依林藪編蓬為門甕為牖心造羲皇太古前道傳鄒魯千年後隱遁寧非鶡冠流龍鍾已是龎眉叟子真谷口自耕巖中散山陽空鍛栁平生視世一浮埃富貴于身復何有牀上常堆元晏書尊中滿泛柴桑酒興發揮毫黑電飛粲粲驪珠驚落手詩成不啻萬人傳吟罷如聞百靈走五嶽之中泰華尊下視羣山俱培塿我因流寓偶相逢識面便似知心友藹然和氣即陽春徒爾芳妍映衰朽劇談不了清夜徂光動文星逼南斗人生㑹合良有時歎息歡娛豈能久起來擊劍為君歌歌長劍作蛟龍吼明朝别去遙相思渭北江東幾回首客邸中秋對月去年中秋秋月圓浩歌對酒清無眠烟霏滅盡人境寂仰看明月懸中天今年客裏中秋月靜裛金波更清絶可憐有月客無酒不照歡娛照離别夜䦨淅淅西風凉月中老桂吹天香悠然長嘯動歸興坐久零露沾衣裳浮世悲歡何足數庾樓赤壁俱塵土風流已往明月來山色江聲自今古雪夜放歌羲和羲和鞭六龍白日西飛幾時歇舊年已去新年來苦厭兵塵尚騷屑嗟豫流寓客未歸年老思家心欲折江雲黯慘北風來一夜雨花吹作雪夜長祇有夢還家夢破衾稜冷如鐵起看宇宙絶纎埃倣佛三山白銀闕羣隂漸滅陽氣回栁眼舒春草芽出君不見漢袁安僵卧閉門膚欲裂一朝富貴來逼人經邦論道稱材傑又不見唐杜甫飢走荒山淚成血致君有術徒自憐布褐許身侔稷契我今齒落百不堪况乃疏頑臨事拙願銷兵甲事春農四海清平萬民悅秋夜長秋夜長不成寐牀前月光白如紙歌窈窕懷清泠夜中怪底荒雞鳴倒裳起舞感慨作乾坤無處無戈兵空山孤鶴更清唳憂懷欲寫茫無際坐看黃葉墜我前零露漙漙下庭砌明星爛爛銀漢橫銅壺滴滴刻漏長事殊興極聽轉悄夜如何其渠未央秋夜長長如此年來誰識征夫苦忍拋兒女戍邊城婦事姑嫜應門户嗟爾羣棲烏繞樹徒驚飛豈知孤鳯凰集彼朝陽枝可以舞簫韶銜瑞圖一四海混八區鳯兮鳯兮覽德輝鳯兮鳯兮覽德輝寄雲山寺僧人草堂白雲深羃羃青山鬱峩峩道人無住著奈此青山何山中草堂花映戶禪味由來最清苦嗟豫寥落徒相思身絆塵緣乃逺阻李鄴侯懶瓉公平生道氣長塞胸法中老將人中雄曽翻硯水作𤣥雨號令神物驅蛟龍朅來談笑九天上坐使六合生華風蒼生戢戢俱在甄陶中公今顧我如有意㑹飛杖錫凌蒼空答元易陳先生人生自古多離别尺書逺寄何由徹短世光隂過隙駒坐覺朱顔易衰歇君看喬嶽千尺松挺立蒼然傲霜雪風來倣佛蒼龍吟六月清寒換炎熱槿花雖榮不足論朝開暮落香已絶只今尚憶江湖遊扣舷一歌寬我憂腰間老劍欲飛動紫氣鬱鬱橫清秋虛名役人浪自苦黃塵兩鬢風颼颼千古乾坤等逆旅百年生死同浮漚君不見鴟夷子功成去養魚千頭藤杖贈西原道人山人贈爾藤一枝怪形偃蹇如蛟螭平生丘壑我所愛魑魅驚走安敢窺梓潼當年贈桃竹書閣照夜然青藜吁嗟古人迹已逺能無此物相扶持趙州八十始行腳芒鞋健步雙龎眉登山涉水覽幽勝意倦未必忘歸期舊傳化龍不復見能解虎鬬安足奇吾師履行極平坦世人方寸生九疑雲山住處本禪寂猿鳥為伴真相知大千由來在腳底要探理窟窮𤣥機鼓枻還從甬東去出門一笑孤雲飛簡子文林訓導東風落盡辛夷花遙憶美人天一涯美人久别音信杳想見只今雙鬢華山房幽深市囂逺白日枕書眠碧霞崖髙瀑布灑晴雪净洗石鼎烹春茶平生青紫不掛眼榮名絆人安足誇當年我來訪遺跡拄杖看雲著雙屐玉簫吹斷鳯不來但見千峯倚天碧臺前日夜溪水流金星光動溪中石邑志西溪有金星石石㸃㸃如金星脫身擬欲恣幽棲坐占瓊臺煉金液衰年誤墮塵網中齒豁頭童竟何益和戴文凖材重椅桐價璧瑜山川清氣孕魁奇談經奪席輸年少獨步當今更有誰君如局促轅下駒平生志氣壯萬夫虞卿窮愁書始著孟軻好辨言非迂今人雖生古人後古人豈與今人殊要吞五車在胸次取之無盡用有餘聖賢道脉傳不泯名懸萬代日月俱致君唐虞比稷契豈但可托六尺孤文風逺揚起頺俗才行傑出稱醇儒我今見君一傾蓋情同魚水交歡娛丈夫重義輕富貴厚顔濫祿非吾徒却笑揚郎老執㦸一官不徙誰吹噓多君韞櫝同美玉不待善價安肯沽何妨教兒壓新酒長歌且鱠松江鱸五言長律借韻簡叔向陳先生干戈尋滿地愁殺杜陵人雲蔽青霄日風揚碧海塵積骸腥血滿飛檄羽毛新倦坐憑烏几長吟岸白綸擁麾思宿將伏闕憶忠臣何日梟羣冦餘波澤四民朝廷安反側草莽足容身㑹見祠郊廟歌詩薦白麟次韻自述寄連隱君林下棲遲好一窩天地春流年催白髮隨分守清貧伯樂能知馬商鉏不識麟素琴當掛壁黃卷久堆塵交友慕徐稚從人嘲子雲世情多反覆道味獨醇真田野深禾黍溪流半藻蘋白雲閒伴鶴明月靜窺人釃酒能無醉論文㑹有因相期遊汗漫垂釣漢江濵答李子光羣雞溷野鶴意氣獨昻昻誰料紅塵裏能逢白玉郎雙鳬俱北翥一鴈獨南翔久别何須嘆相思豈易量聲名過沈鮑製作擬班揚笑我人材拙何如襪線長流年悲白髮却老慕仙方僅得清而瘦終期壽且昌籬邊栽細菊徑底植修篁抱甕田畦外操觚澗水傍蹉跎千里志愁絶九回腸公子多文翰天葩壓衆芳朝廷崇禮樂歌頌美成康堂上萊衣舞階前萱草香瑶琴彈緑綺雅調合清商指日羅英俊承恩步玉堂和包原彬韻旅食京華日鶯啼上苑春魯連惟仗義范叔不辭貧絶域來龍馬清時出鳯麟襟懷開霽月談笑接清塵滄海三枝樹青霄五色雲酒傾香味别詩寫性情真吳地追遊好龍山入夢頻烟花如媚客風雨似留人男子生何幸朋交素有因遙知理歸楫隨處覔通津答適菴李先生韻價髙由少室望重自元紘奕世遺簮笏清時識鑑衡文章尊賈董智勇賤黥彭圭璧含餘潤塤箎協正聲嶽分嵩峻極源出渭流清賓館憐巢幕侯門恥饜鯖平生敦夙好俊逸藹芳聲律已綱常正填心道義精鶉懸衣可結毫健筆能耕詩壘時堅壁詞場夜斫營别來常慕藺何日遂班荆紫氣寧臨顧函關枉候偵風姿勞我夢月旦與誰評柏厲凌霜操葵傾向日誠朝廷嚴戰伐川澤困漁征羣豎凶猶活諸公憤不平器欹因滿覆弨弛在排檠漕待木牛運功須汗馬成輪雲知變態金石見交情烟瘴連淮海風塵隔薊城行當洗兵甲且復酌杯鐺擊壤歡農父傳書走價伻山林聊自逸猿鳥不須驚鳯闕瞻佳士雞窗憶舊盟蓬蒿棲仲蔚松菊媚淵明琴調朝飛雉笙歌午囀鶯乾坤萬里在寒暑四時更愁髮長千丈吟髭白數莖窮居仍野處坎止任流行相去如吳越思君太瘦生雲松巢集卷三
